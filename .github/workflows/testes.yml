
name: Testes automatizados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pedidos_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pedidos_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pedidos_db
      API_URL: http://localhost:3000

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar API
        run: |
          npm start > server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          cat server.log
          exit 1

      - name: Executar testes
        run: npm test
